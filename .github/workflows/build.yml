name: Build LineageOS 18.1 for Infinix X626B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: 2. Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 3. Install Build Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python-is-python3

      - name: 4. Setup Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y repo
          repo --version

      - name: 5. Initialize & Sync LineageOS 18.1
        run: |
          mkdir -p ~/rom
          cd ~/rom
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          
          # تجميع الرابط برمجياً لمنع انقطاعه عند النسخ واللصق
          GH="https://github.com"
          MANIFEST_URL="${GH}/LineageOS/android.git"
          echo "Initializing manifest from: $MANIFEST_URL"
          
          repo init --depth=1 -u "$MANIFEST_URL" -b lineage-18.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: 6. Setup Device & Vendor Trees
        run: |
          cd ~/rom
          GH="https://github.com"
          git clone "${GH}/sheepan2026-hash/android_device_Infinix_S4.git" device/Infinix/X626
          
          cd ~/rom/device/Infinix/X626
          # إعادة اسم ملف المنتج الأصلي X626 لضمان تطابق التغليف النهائي 100%
          [ -f lineage_X626B.mk ] && mv lineage_X626B.mk lineage_X626.mk || true
          sed -i 's/X626B/X626/g' lineage_X626.mk AndroidProducts.mk
          sed -i 's|device/infinix/X626|device/Infinix/X626|g' lineage_X626.mk AndroidProducts.mk
          
          # السماح بتفليش الروم على X626B و X626 معاً دون رفض من الريكفري
          echo 'TARGET_OTA_ASSERT_DEVICE := X626,X626B,Infinix-X626,Infinix-X626B' >> BoardConfig.mk
          
          # تحديث معمارية المعالج لتتوافق مع Android 11
          find . -type f -exec sed -i 's/armv7-a-neon/armv8-a/g' {} +
          
          # تحميل وفك ضغط ملف الـ Vendor
          cd ~/rom
          curl -L "${GH}/sheepan2026-hash/rom-builder-infinix-x626b/releases/download/vendor-blobs-x626b/vendor_x626b.zip" -o vendor.zip
          unzip -o vendor.zip -d ~/rom/

      - name: 7. Compile ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_X626-userdebug
          mka otapackage -j$(nproc --all)

      - name: 8. Upload ROM to PixelDrain
        run: |
          ROM_FILE=$(find ~/rom/out/target/product/X626/ -name "*ota*.zip" -o -name "lineage-*.zip" | head -n 1)
          echo "Found ROM file: $ROM_FILE"
          curl -T "$ROM_FILE" https://pixeldrain.com

