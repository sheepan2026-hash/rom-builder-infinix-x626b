name: Extract Vendor Blobs for Infinix X626B

on:
  workflow_dispatch:

env:
  # ⚠️ عدّل هذه البيانات الأربعة فقط:
  ROM_URL: "https://download1077.mediafire.com/j035n0ay1bxgKEo9a0g2wB1Xgpgv3ANLderg-vxoxoaW6G5hK4jDfXtgHO27c5sVW7Yn3_7IK29a54NfNvfn-DL68lZsR-hRbS5j2fh6pk2h4ASAn1qsy09NgpNuRKQ4JAvjlfP5jaNdcu5-Y4tYfd5b2IgV4vtRtlwOgSxJ1BjNgg/zd9i9jgf43jixrk/INFINIX-S4-X626B-H623JKN-P-210127V323-FLASH-FILE-RepairMyMobile.rar"
  GITHUB_USER: "sheepan2026-hash"
  GITHUB_TOKEN: "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"
  DEVICE_TREE_URL: "https://github.com"

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 1. Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: 2. Install Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip simg2img python3 python3-pip git curl wget
          pip3 install mediafire-dl

      - name: 3. Download & Extract Stock ROM
        run: |
          mkdir -p ~/stock_rom/extracted
          cd ~/stock_rom
          echo "Downloading Stock ROM via mediafire-dl..."
          mediafire-dl "$ROM_URL" -o stock.zip
          
          7z x stock.zip -oextracted/
          
          cd extracted
          SYSTEM_IMG=$(find . -name "system.img" | head -n 1)
          VENDOR_IMG=$(find . -name "vendor.img" | head -n 1)
          
          mkdir -p ~/dump/system ~/dump/vendor
          simg2img "$SYSTEM_IMG" system_raw.img || cp "$SYSTEM_IMG" system_raw.img
          simg2img "$VENDOR_IMG" vendor_raw.img || cp "$VENDOR_IMG" vendor_raw.img
          
          7z x system_raw.img -o"$HOME/dump/system" -y
          7z x vendor_raw.img -o"$HOME/dump/vendor" -y


      - name: 4. Run Device Extract Script
        run: |
          mkdir -p ~/work/device/infinix/X626B
          https://github.com/sheepan2026-hash/android_device_Infinix_S4.git
          cd ~/work/device/infinix/X626B
          
          # منح صلاحية التشغيل لسكربت الاستخراج وتشغيله
          chmod +x extract-files.sh
          ./extract-files.sh ~/dump

      - name: 5. Push Vendor Blobs to GitHub
        run: |
          cd ~/work/vendor/infinix/X626B
          git init
          git config user.name "$GITHUB_USER"
          git config user.email "$GITHUB_USER@://github.com"
          git branch -M lineage-18.1
          git add .
          git commit -m "X626B: Import proprietary vendor blobs from stock ROM"
          git remote add origin https://${GITHUB_USER}:${GITHUB_TOKEN}@://github.com{GITHUB_USER}/proprietary_vendor_infinix_X626B.git
          git push -u origin lineage-18.1 --force
