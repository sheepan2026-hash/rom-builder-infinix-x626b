name: Extract Vendor Blobs for Infinix X626B

on:
  workflow_dispatch:
env:
  ROM_URL: "https://download1326.mediafire.com/qwu561izkacgfFV_d0hjEEaSftb57DAwUex8-nDoqBysG1xGexO6tnw-l_p-FC1f_FDBK26066WF8RXOt6WWRxrYB65koI3zuSkgXErjosZLofa7PrL7GhGfoAxnMaJu88xZzmM5KI0z3nKTdiowzU09Oct034KyDjpZ5Yh3ZNLmpw/co5iv6mf70ctgem/Ahmadservicecenter.com-X626B-H623JKN-P-210127V323.zip"


jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 1. Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: 2. Install Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip zip simg2img python3 python3-pip git curl wget
          pip3 install gdown

      - name: 3. Download & Extract Stock ROM
        run: |
          mkdir -p ~/stock_rom/extracted
          cd ~/stock_rom
          
          # تحميل الروم من Google Drive بدون أي حظر
          gdown "https://drive.google.com/file/d/1OsVyvd1mzLF637UelxvvnMlfaCpRV9Wf/view?usp=sharing" -O stock.zip
          
          7z x stock.zip -oextracted/
          
          cd extracted
          SYSTEM_IMG=$(find . -name "system.img" | head -n 1)
          VENDOR_IMG=$(find . -name "vendor.img" | head -n 1)
          
          mkdir -p ~/dump/system ~/dump/vendor
          simg2img "$SYSTEM_IMG" system_raw.img || cp "$SYSTEM_IMG" system_raw.img
          simg2img "$VENDOR_IMG" vendor_raw.img || cp "$VENDOR_IMG" vendor_raw.img
          
          7z x system_raw.img -o"$HOME/dump/system" -y
          7z x vendor_raw.img -o"$HOME/dump/vendor" -y




      - name: 4. Run Device Extract Script
        run: |
          mkdir -p ~/rom/device/infinix/X626B ~/rom/vendor/lineage/build/tools
          
          GH="https://github.com"
          # وضع أدوات الاستخراج في المسار الدقيق الذي يطلبه السكربت
          git clone --depth=1 "${GH}/LineageOS/android_tools_extract-utils.git" -b lineage-18.1 ~/rom/vendor/lineage/build/tools
          git clone "${GH}/sheepan2026-hash/android_device_Infinix_S4.git" ~/rom/device/infinix/X626B
          
          cd ~/rom/device/infinix/X626B
          chmod +x *.sh
          ./extract-files.sh ~/dump
          
          # حذف مجلد الأدوات المؤقت وضغط مجلد التعريفات الناتج (Infinix/X626) بالكامل
          rm -rf ~/rom/vendor/lineage
          cd ~/rom
          zip -r ~/vendor_x626b.zip vendor/


      - name: 5. Save Vendor Blobs as Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vendor-blobs-x626b
          name: Infinix X626B Vendor Blobs
          files: ~/vendor_x626b.zip
