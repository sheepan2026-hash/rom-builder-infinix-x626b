name: Extract Vendor Blobs for Infinix X626B

on:
  workflow_dispatch:
env:
  ROM_URL: "https://download1326.mediafire.com/qwu561izkacgfFV_d0hjEEaSftb57DAwUex8-nDoqBysG1xGexO6tnw-l_p-FC1f_FDBK26066WF8RXOt6WWRxrYB65koI3zuSkgXErjosZLofa7PrL7GhGfoAxnMaJu88xZzmM5KI0z3nKTdiowzU09Oct034KyDjpZ5Yh3ZNLmpw/co5iv6mf70ctgem/Ahmadservicecenter.com-X626B-H623JKN-P-210127V323.zip"


jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 1. Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: 2. Install Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip zip simg2img python3 python3-pip git curl wget
          pip3 install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 3. Download & Extract Stock ROM
        run: |
          mkdir -p ~/stock_rom/extracted
          cd ~/stock_rom
          
          cat << 'EOF' > download.py
          from playwright.sync_api import sync_playwright
          import os, sys

          url = "https://mediafire.com"
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")
              page = context.new_page()
              
              print("Opening MediaFire page in headless browser...")
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_selector("a#downloadButton", timeout=30000)
              
              direct_url = page.locator("a#downloadButton").get_attribute("href")
              browser.close()

              if direct_url and direct_url.startswith("http"):
                  print(f"Success! Direct link extracted.")
                  os.system(f'wget -O stock.zip "{direct_url}"')
              else:
                  print("Could not extract valid link.")
                  sys.exit(1)
          EOF

          python3 download.py
          7z x stock.zip -oextracted/
          
          cd extracted
          SYSTEM_IMG=$(find . -name "system.img" | head -n 1)
          VENDOR_IMG=$(find . -name "vendor.img" | head -n 1)
          
          mkdir -p ~/dump/system ~/dump/vendor
          simg2img "$SYSTEM_IMG" system_raw.img || cp "$SYSTEM_IMG" system_raw.img
          simg2img "$VENDOR_IMG" vendor_raw.img || cp "$VENDOR_IMG" vendor_raw.img
          
          7z x system_raw.img -o"$HOME/dump/system" -y
          7z x vendor_raw.img -o"$HOME/dump/vendor" -y



      - name: 4. Run Device Extract Script
        run: |
          mkdir -p ~/work/device/infinix/X626B
          git clone https://github.com/sheepan2026-hash/android_device_Infinix_S4.git ~/work/device/infinix/X626B
          cd ~/work/device/infinix/X626B
          chmod +x extract-files.sh
          ./extract-files.sh ~/dump
          
          # ضغط مجلد الـ Vendor الناتج في ملف مضغوط واحد
          cd ~/work
          zip -r ~/vendor_x626b.zip vendor/

      - name: 5. Save Vendor Blobs as Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vendor-blobs-x626b
          name: Infinix X626B Vendor Blobs
          files: ~/vendor_x626b.zip
